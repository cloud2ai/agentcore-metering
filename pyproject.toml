[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcore-metering"
dynamic = ["version"]
description = "Unified observability for LLM/text, image, and video calls (Django adapter)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Cloud2AI" }]
keywords = ["django", "llm", "litellm", "metering", "observability", "cost", "agentcore"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Framework :: Celery",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "django>=4.2",
    "djangorestframework>=3.14",
    "drf-spectacular>=0.27.0",
    # Keep this upper bound until https://github.com/BerriAI/litellm/issues/32993 is resolved.
    "litellm>=1.0.0,<=1.91.3",
    "json-repair>=0.25.0",
    "pyyaml>=6.0",
    "celery>=5.0",
    "agentcore-task>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
]

[project.urls]
Homepage = "https://github.com/cloud2ai/agentcore-metering"
Repository = "https://github.com/cloud2ai/agentcore-metering"
Issues = "https://github.com/cloud2ai/agentcore-metering/issues"
Changelog = "https://github.com/cloud2ai/agentcore-metering/releases"

[tool.setuptools.dynamic]
version = { attr = "agentcore_metering.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["agentcore_metering*"]

[tool.setuptools.package-data]
"agentcore_metering.adapters.django.llm_static" = ["*.yaml", "*.md", "providers/*.yaml"]
"agentcore_metering.adapters.django" = [
    "locale/*/LC_MESSAGES/*.po",
    "locale/*/LC_MESSAGES/*.mo",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
addopts = "-v"
testpaths = ["tests"]
markers = [
    "unit: unit tests (no HTTP)",
    "api: API/integration tests (HTTP endpoints)",
]
